#cloud-config
# =============================================================================
# cloud-init-ca.yml — CA server initialization
#
# Placeholders replaced by 01-azure-infra.sh before VM creation:
#   {{PROVIDER}}    → liboqs | symcrypt
#   {{ORG_NAME}}    → organization name for CA subject
#   {{ORG_COUNTRY}} → 2-letter country code
#   {{ORG_STATE}}   → state/province
# =============================================================================

package_update: true
package_upgrade: true

packages:
  - build-essential
  - cmake
  - ninja-build
  - git
  - curl
  - wget
  - libssl-dev
  - python3-pip
  - python3-pytest
  - astyle
  - doxygen
  - graphviz
  - unzip
  - xsltproc
  - python3-yaml
  - jq
  - gcc
  - g++
  - pkg-config

write_files:
  - path: /etc/profile.d/pq-provider.sh
    content: |
      # Post-quantum OpenSSL provider selection
      export PQ_PROVIDER="{{PROVIDER}}"
      if [ "$PQ_PROVIDER" = "liboqs" ]; then
        export OPENSSL_CONF=/opt/pq-ca/openssl-pq.cnf
      else
        export OPENSSL_CONF=/opt/pq-ca/openssl-symcrypt.cnf
      fi
    permissions: '0644'

  - path: /opt/pq-ca-setup/env.sh
    content: |
      export PQ_PROVIDER="{{PROVIDER}}"
      export ORG_NAME="{{ORG_NAME}}"
      export ORG_COUNTRY="{{ORG_COUNTRY}}"
      export ORG_STATE="{{ORG_STATE}}"
      if [ "$PQ_PROVIDER" = "liboqs" ]; then
        export OPENSSL_CONF=/opt/pq-ca/openssl-pq.cnf
      else
        export OPENSSL_CONF=/opt/pq-ca/openssl-symcrypt.cnf
      fi
    permissions: '0644'

runcmd:
  # Create CA directory structure
  - |
    mkdir -p /opt/pq-ca-setup
    mkdir -p /opt/pq-ca/{root-ca,intermediate-ca}
    mkdir -p /opt/pq-ca/root-ca/{certs,crl,newcerts,private,csr}
    mkdir -p /opt/pq-ca/intermediate-ca/{certs,crl,newcerts,private,csr}
    chmod 700 /opt/pq-ca/root-ca/private
    chmod 700 /opt/pq-ca/intermediate-ca/private
    touch /opt/pq-ca/root-ca/index.txt
    touch /opt/pq-ca/intermediate-ca/index.txt
    echo 1000 > /opt/pq-ca/root-ca/serial
    echo 1000 > /opt/pq-ca/intermediate-ca/serial
    echo 1000 > /opt/pq-ca/root-ca/crlnumber
    echo 1000 > /opt/pq-ca/intermediate-ca/crlnumber
    echo "CA directories initialized" >> /var/log/pq-setup.log

  # Write setup status sentinel
  - echo "cloud-init: packages installed and directories ready" >> /var/log/pq-setup.log
  - echo "CLOUD_INIT_DONE=1" > /opt/pq-ca-setup/.cloud-init-status

final_message: |
  PQ CA cloud-init complete.
  Provider: {{PROVIDER}}
  Next: SSH in and run /opt/pq-ca-setup/02-install-provider.sh
