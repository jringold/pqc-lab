#cloud-config
# =============================================================================
# cloud-init-client.yml — Ubuntu desktop client VM initialization
#
# Installs a lightweight GUI desktop plus tooling needed for TLS client
# validation. PQ provider installation is performed later by
# 00-remote-deploy.sh via 02-install-provider.sh.
# =============================================================================

package_update: true
package_upgrade: true

packages:
  - xfce4
  - xfce4-goodies
  - xrdp
  - xorgxrdp
  - dbus-x11
  - x11-xserver-utils
  - firefox
  - build-essential
  - cmake
  - ninja-build
  - git
  - curl
  - wget
  - jq
  - openssl
  - ca-certificates
  - libssl-dev
  - python3
  - python3-pip
  - pkg-config
  - gcc
  - g++

write_files:
  - path: /etc/skel/.xsession
    content: |
      startxfce4
    permissions: '0644'

runcmd:
  - adduser xrdp ssl-cert || true
  - systemctl enable xrdp
  - systemctl enable xrdp-sesman
  - systemctl restart xrdp
  - mkdir -p /opt/pq-ca /opt/pq-ca-setup
  - mkdir -p /home/{{ADMIN_USER}}/Desktop
  - cp /etc/skel/.xsession /home/{{ADMIN_USER}}/.xsession
  - chown {{ADMIN_USER}}:{{ADMIN_USER}} /home/{{ADMIN_USER}}/.xsession
  - chmod 0644 /home/{{ADMIN_USER}}/.xsession
  - echo "Desktop client VM ready for PQ provider install, browser tests, and TLS verification" >> /var/log/pq-setup.log
  - echo "CLOUD_INIT_DONE=1" > /tmp/.cloud-init-client-status

final_message: |
  PQ desktop client VM cloud-init complete.
  Next: run 00-remote-deploy.sh to install provider and execute GUI/browser tests.
