#cloud-config
# =============================================================================
# cloud-init-web.yml — Apache web server initialization
#
# Installs Apache and mod_ssl. The PQ provider and certificates are
# pushed from the CA VM by 04-issue-server-cert.sh after CA setup.
# =============================================================================

package_update: true
package_upgrade: true

packages:
  - apache2
  - libapache2-mod-ssl
  - curl
  - jq
  - openssl

runcmd:
  - a2enmod ssl headers
  - systemctl enable apache2
  - systemctl start apache2
  - mkdir -p /etc/apache2/envvars.d
  - echo "Apache ready for PQ certificate deployment" >> /var/log/pq-setup.log
  - echo "CLOUD_INIT_DONE=1" > /tmp/.cloud-init-web-status

final_message: |
  PQ Web VM cloud-init complete.
  Apache installed and enabled.
  Next: Run 04-issue-server-cert.sh from the CA VM to push certs.
